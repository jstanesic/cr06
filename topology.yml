name: cr06

hosts:
  - name: dc01
    flavor: c4_r5_d120
    base_box:
      image: windows-server-2025-x86_64
      mgmt_user: windows
    hidden: false
  - name: srv01
    flavor: c4_r5_d120
    base_box:
      image: windows-server-2025-x86_64
      mgmt_user: windows
    hidden: false
  - name: cli01
    flavor: c4_r5_d50
    base_box:
      image: windows-11-x86_64
      mgmt_user: windows
    hidden: false
  - name: cli02
    flavor: c4_r5_d50
    base_box:
      image: windows-11-x86_64
      mgmt_user: windows
    hidden: false

routers:
  - name: r-corp
    flavor: c1_r2_d10
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    hidden: false

networks:
  - name: corp
    cidr: 10.0.0.0/24
    accessible_by_user: true
    hidden: false

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

net_mappings:
  - host: dc01
    network: corp
    ip: 10.0.0.3
  - host: srv01
    network: corp
    ip: 10.0.0.4
  - host: cli01
    network: corp
    ip: 10.0.0.5
  - host: cli02
    network: corp
    ip: 10.0.0.6

router_mappings:
  - router: r-corp
    network: corp
    ip: 10.0.0.1

groups:
  - name: domain-controllers
    nodes:
      - dc01
  - name: member-servers
    nodes:
      - srv01
  - name: workstations
    nodes:
      - cli01
      - cli02
  - name: windows-members
    nodes:
      - srv01
      - cli01
      - cli02
  - name: windows-hosts
    nodes:
      - dc01
      - srv01
      - cli01
      - cli02
